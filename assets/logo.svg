<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="NexDroid logo: an N with a frame-time trace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232838"/><stop offset="1" stop-color="#12151f"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc65c"/><stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#3a4258" stroke-width="3"/>

  <!-- The N keeps the old performance-chart visual language. -->
  <path d="M142 370 V 138 L370 370 V 138"
        fill="none" stroke="url(#amber)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A frame-time trace: steady, with one jank spike. Measure first. -->
  <path d="M150 314 L186 314 L210 306 L236 314 L264 310 L294 184 L320 314 L348 306 L374 314"
        fill="none" stroke="#4fd1c5" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
